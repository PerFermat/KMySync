# Ein Ort für alle Abhängigkeits-Fassungen der drei Module.
#
# Anlass war eine konkrete Falle: Die drei BouncyCastle-Module müssen dieselbe Fassung tragen –
# gemischte Versionen brechen zur Laufzeit, nicht beim Bauen. Das stand als Kommentar in
# app/build.gradle und daneben dreimal dieselbe Zahl als Literal. Genau dafür gibt es version.ref:
# jetzt gibt es die Zahl einmal, und ein Anheben kann gar nicht mehr nur zwei der drei treffen.
# Dasselbe galt für appcompat und play-services-wearable, die :app und :wear gemeinsam führen.
#
# NICHT hier stehen versionCode und versionName. Die bleiben in app/build.gradle bzw.
# wear/build.gradle als Literal, weil F-Droids checkupdates sie dort per regulärem Ausdruck sucht.
# Ein Umzug hierher würde das Rezept still unbrauchbar machen – still deshalb, weil es erst beim
# nächsten automatischen Versionsabgleich auffiele, nicht beim Bauen.

[versions]
# --- Android-Gerüst (in allen drei Modulen gleich) ---
compileSdk = "34"
targetSdk = "34"

# --- Von :app und :wear gemeinsam geführt ---
appcompat = "1.7.0"
wearable = "18.2.0"
junit = "4.13.2"

# --- Alle drei Module MÜSSEN dieselbe Fassung tragen (siehe oben) ---
bouncycastle = "1.78.1"

# --- Nur :app ---
material = "1.12.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
swiperefreshlayout = "1.1.0"
documentfile = "1.0.1"
room = "2.6.1"
okhttp = "4.12.0"
smbj = "0.13.0"
slf4j = "2.0.9"
osmdroid = "6.1.18"
pdfbox = "2.0.27.0"
securityCrypto = "1.1.0-alpha06"
biometric = "1.1.0"
robolectric = "4.13"
androidxTestCore = "1.6.1"

# --- Nur :wear ---
wear = "1.3.0"
tiles = "1.1.0"
concurrentFutures = "1.1.0"
kotlinStdlib = "1.8.22"

# --- Nur :mpandroidchart ---
annotation = "1.7.1"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }

osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
pdfbox = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "wearable" }
wear = { module = "androidx.wear:wear", version.ref = "wear" }
tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlinStdlib" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlinStdlib" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
