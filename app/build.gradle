plugins {
    id 'com.android.application'
}

// Signier-Daten aus keystore.properties laden (nicht eingecheckt). Fehlt die Datei,
// wird der Release-Build einfach unsigniert erzeugt.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'de.spahr.ausgaben'
    compileSdk 34

    defaultConfig {
        applicationId "de.spahr.ausgaben"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "2.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Zwei Distributionen: „full" (GitHub) mit Wear-Anbindung über Google Play Services; „foss" (F-Droid)
    // ohne jegliches GMS. Die GMS-Klassen liegen nur im src/full-Sourceset (+ full-Manifest), die Dependency
    // ist fullImplementation. „foss" bekommt einen No-op-Stub für LanguageSync.
    flavorDimensions "dist"
    productFlavors {
        full { dimension "dist" }
        foss { dimension "dist" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Die drei BouncyCastle-Module bringen jeweils dieselbe OSGi-Metadatei mit. Sie hat im APK
            // nichts zu suchen, und ohne diese Zeile bricht das Zusammenführen an der Dublette ab.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    buildFeatures {
        viewBinding false
    }

    testOptions {
        // JVM-Unit-Tests reiner Logik (kein Android-Runtime); Android-Stubs liefern Defaults statt Fehler.
        unitTests.returnDefaultValues = true
        // Die kmy-Tests laufen unter Robolectric und brauchen dafür echte Ressourcen (Fehlertexte).
        unitTests.includeAndroidResources = true
        // Ordner mit KMyMoney-Dateien für KmyCorpusTest durchreichen: ./gradlew … -Dkmy.corpus=/pfad
        unitTests.all {
            if (System.getProperty('kmy.corpus')) {
                it.systemProperty 'kmy.corpus', System.getProperty('kmy.corpus')
                it.outputs.upToDateWhen { false }
            }
            // Ohne eigene Grenze erbt der Test-Worker die 2048 MB des Gradle-Daemons
            // (org.gradle.jvmargs) – zu knapp für BackupArchiveTest, der testweise ein
            // Gigabyte-Archiv entpackt (bricht bei 256 MB ab, aber ByteArrayOutputStream
            // verdoppelt beim Wachsen kurzzeitig auf mehr).
            it.maxHeapSize = '3072m'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Blättern zwischen den Belegseiten im eigenen Betrachter.
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // SMB/Samba-Client (SMB2/3). BouncyCastle liefert die auf Android fehlende AES-CMAC-Signierung;
    // slf4j-nop unterdrückt die Logging-Warnung von smbj (kein Binding auf Android nötig).
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'org.slf4j:slf4j-nop:2.0.9'

    // BouncyCastle für SMB (AES-CMAC) und PDF (verschlüsselte Dokumente). Alle drei Module müssen
    // dieselbe Fassung haben – gemischte BouncyCastle-Versionen brechen zur Laufzeit.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.78.1'

    // Karten-Auswahl für Alias-Standort (OpenStreetMap, kein API-Key nötig).
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // PDF-Textebene lesen (Depotabrechnungen). Apache 2.0, rein lokal – Android selbst kann nur rendern
    // (PdfRenderer liefert Bilder), nicht an den Text.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        // Zieht BouncyCastle 1.72 in der jdk15to18-Ausgabe nach; die App führt bereits 1.78.1 (jdk18on)
        // mit denselben Klassennamen – beides zusammen scheitert schon beim Bauen an Dubletten.
        exclude group: 'org.bouncycastle'
    }

    // Aus dem Quellcode gebaut (Submodul third_party/MPAndroidChart, Tag v3.1.0) statt über
    // JitPack, das F-Droid nicht zulässt (siehe mpandroidchart/build.gradle).
    implementation project(':mpandroidchart')
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Nur im „full"-Flavor: Wear Data Layer (Google Play Services, proprietär). Der „foss"-Flavor (F-Droid)
    // enthält kein GMS – siehe src/foss/.../wear/LanguageSync.java (No-op) und das fehlende full-Manifest.
    fullImplementation 'com.google.android.gms:play-services-wearable:18.2.0'

    testImplementation 'junit:junit:4.13.2'
    // Nur für Tests: KmyDocument/KmyImporter/KmyExporter brauchen android.util.Xml, TextUtils und einen
    // Context. Robolectric stellt die auf der JVM bereit; im APK landet davon nichts.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
