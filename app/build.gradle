plugins {
    id 'com.android.application'
}

// Signier-Daten aus keystore.properties laden (nicht eingecheckt). Fehlt die Datei,
// wird der Release-Build einfach unsigniert erzeugt.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'de.spahr.ausgaben'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "de.spahr.ausgaben"
        minSdk 26
        targetSdk libs.versions.targetSdk.get().toInteger()
        // versionCode und versionName bleiben absichtlich Literale: F-Droids checkupdates sucht sie
        // hier per regulärem Ausdruck. Im Versionskatalog fände es sie nicht – und das fiele erst
        // beim nächsten Versionsabgleich auf, nicht beim Bauen.
        versionCode 15
        versionName "2.1"

        // Room schreibt das erzeugte Schema als JSON hierher, eine Datei je Datenbankversion. Die
        // Dateien gehören ins Repo: SchemaMigrationTest baut daraus den alten Zustand nach und lässt
        // Room die Migrationen dagegen prüfen. Ohne sie fiele ein falscher Spaltentyp erst auf dem
        // Gerät des Nutzers auf – als Absturz beim Öffnen, denn fallbackToDestructiveMigration gibt
        // es bewusst nicht.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Zwei Distributionen: „full" (GitHub) mit Wear-Anbindung über Google Play Services; „foss" (F-Droid)
    // ohne jegliches GMS. Die GMS-Klassen liegen nur im src/full-Sourceset (+ full-Manifest), die Dependency
    // ist fullImplementation. „foss" bekommt einen No-op-Stub für LanguageSync.
    flavorDimensions += "dist"
    productFlavors {
        full { dimension "dist" }
        foss { dimension "dist" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Die drei BouncyCastle-Module bringen jeweils dieselbe OSGi-Metadatei mit. Sie hat im APK
            // nichts zu suchen, und ohne diese Zeile bricht das Zusammenführen an der Dublette ab.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    buildFeatures {
        viewBinding false
    }

    testOptions {
        // JVM-Unit-Tests reiner Logik (kein Android-Runtime); Android-Stubs liefern Defaults statt Fehler.
        unitTests.returnDefaultValues = true
        // Die kmy-Tests laufen unter Robolectric und brauchen dafür echte Ressourcen (Fehlertexte).
        unitTests.includeAndroidResources = true
        // Ordner mit KMyMoney-Dateien für KmyCorpusTest durchreichen: ./gradlew … -Dkmy.corpus=/pfad
        unitTests.all {
            if (System.getProperty('kmy.corpus')) {
                it.systemProperty 'kmy.corpus', System.getProperty('kmy.corpus')
                it.outputs.upToDateWhen { false }
            }
            // Ohne eigene Grenze erbt der Test-Worker die 2048 MB des Gradle-Daemons
            // (org.gradle.jvmargs) – zu knapp für BackupArchiveTest, der testweise ein
            // Gigabyte-Archiv entpackt (bricht bei 256 MB ab, aber ByteArrayOutputStream
            // verdoppelt beim Wachsen kurzzeitig auf mehr).
            it.maxHeapSize = '3072m'

            // SchemaMigrationTest liest die Room-Schemata zur Laufzeit von der Platte. Ohne diese
            // Zeile kennt Gradle sie nicht als Eingabe: Ändert sich nur eine JSON-Datei, gilt die
            // Aufgabe als aktuell und der Test läuft gar nicht erst. Beim Ausprobieren genau so
            // erlebt – ein verfälschtes Schema blieb unbemerkt, bis --rerun-tasks dazukam.
            it.inputs.dir("$projectDir/schemas")
                    .withPropertyName('roomSchemas')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
                    .optional()
        }
    }
}

// Die Fassungen stehen in gradle/libs.versions.toml. Die Begründungen stehen weiterhin hier, an der
// Zeile, um die es geht – im Katalog stünden sie neben einer Zahl statt neben ihrem Zweck.
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    // Blättern zwischen den Belegseiten im eigenen Betrachter.
    implementation libs.viewpager2
    implementation libs.swiperefreshlayout
    implementation libs.documentfile

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.okhttp

    // SMB/Samba-Client (SMB2/3). BouncyCastle liefert die auf Android fehlende AES-CMAC-Signierung;
    // slf4j-nop unterdrückt die Logging-Warnung von smbj (kein Binding auf Android nötig).
    implementation libs.smbj
    implementation libs.slf4j.nop

    // BouncyCastle für SMB (AES-CMAC) und PDF (verschlüsselte Dokumente). Alle drei Module müssen
    // dieselbe Fassung haben – gemischte BouncyCastle-Versionen brechen zur Laufzeit. Deshalb hängen
    // sie im Katalog an einem gemeinsamen version.ref: Ein Anheben kann gar nicht mehr nur zwei der
    // drei treffen.
    implementation libs.bouncycastle.prov
    implementation libs.bouncycastle.pkix
    implementation libs.bouncycastle.util

    // Karten-Auswahl für Alias-Standort (OpenStreetMap, kein API-Key nötig).
    implementation libs.osmdroid

    // PDF-Textebene lesen (Depotabrechnungen). Apache 2.0, rein lokal – Android selbst kann nur rendern
    // (PdfRenderer liefert Bilder), nicht an den Text.
    implementation(libs.pdfbox) {
        // Zieht BouncyCastle 1.72 in der jdk15to18-Ausgabe nach; die App führt bereits 1.78.1 (jdk18on)
        // mit denselben Klassennamen – beides zusammen scheitert schon beim Bauen an Dubletten.
        exclude group: 'org.bouncycastle'
    }

    // Aus dem Quellcode gebaut (Submodul third_party/MPAndroidChart, Tag v3.1.0) statt über
    // JitPack, das F-Droid nicht zulässt (siehe mpandroidchart/build.gradle).
    implementation project(':mpandroidchart')
    implementation libs.security.crypto
    implementation libs.biometric

    // Nur im „full"-Flavor: Wear Data Layer (Google Play Services, proprietär). Der „foss"-Flavor (F-Droid)
    // enthält kein GMS – siehe src/foss/.../wear/LanguageSync.java (No-op) und das fehlende full-Manifest.
    fullImplementation libs.play.services.wearable

    testImplementation libs.junit
    // Nur für Tests: KmyDocument/KmyImporter/KmyExporter brauchen android.util.Xml, TextUtils und einen
    // Context. Robolectric stellt die auf der JVM bereit; im APK landet davon nichts.
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
}
