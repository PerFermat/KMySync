plugins {
    id 'com.android.application'
}

// Signier-Daten aus keystore.properties laden (wie im :app-Modul). Data Layer verlangt dieselbe
// Signatur wie die Phone-App; fehlt die Datei, wird unsigniert gebaut (Debug nutzt den Debug-Key).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'de.spahr.ausgaben.wear'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        // Gleiche applicationId wie die Phone-App – Voraussetzung für die Wear Data Layer API.
        applicationId "de.spahr.ausgaben"
        minSdk 30
        targetSdk libs.versions.targetSdk.get().toInteger()
        // Literal wie in app/build.gradle – siehe die Begründung dort (F-Droids checkupdates).
        versionCode 15
        versionName "2.1"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// androidx.wear.tiles:1.1.0 zieht altes kotlin-stdlib-jdk7/8:1.6.21; auf 1.8.22 anheben (dort leere
// Stubs), damit keine doppelten Kotlin-Klassen entstehen.
configurations.all {
    resolutionStrategy {
        force libs.kotlin.stdlib.jdk7
        force libs.kotlin.stdlib.jdk8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.wear
    implementation libs.play.services.wearable
    implementation libs.tiles
    implementation libs.concurrent.futures
    // Für die reinen Regeln der Uhr (Lesen der Empfängerliste, Rangfolge im Umkreis): Die laufen
    // ohne Android und lassen sich deshalb hier prüfen statt nur am Handgelenk.
    testImplementation libs.junit
}
